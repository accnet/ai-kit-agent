name: AI-Kit gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run configured tests
        shell: bash
        run: |
          test_command="$(sed -n 's/^test_command:[[:space:]]*//p' .ai-kit/ai.yaml)"
          test -n "$test_command"
          bash -lc "$test_command"
      - name: Check tracked-file hygiene
        run: bash .ai-kit/scripts/check-gates.sh all
